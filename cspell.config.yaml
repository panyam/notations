# Spell-checks the docs site content: pnpm run spell (CI runs it too).
# Most entries are Carnatic terms, raga and composition names, and percussion syllables that
# appear inside notation examples. Add a word here when it is spelled the way the page means it.
version: "0.2"
language: en
files:
  - "docs/content/**/*.html"
# Generated from notation_demos (#71). Song and raga names there are spelled as each file has them.
ignorePaths:
  - "docs/content/library/**"

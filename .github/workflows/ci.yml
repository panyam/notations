name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check:esm is the reason this is a matrix.  Node classifies lib/esm from its own
        # package.json marker on every version, but only 22.12 and later fall back to sniffing
        # module syntax, so a regression in that marker fails differently either side of it.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --ignore-scripts keeps the root `prepare` script from building during install, so a
      # broken build reports as a failed build step rather than a failed install.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - run: pnpm run check:esm

      - run: pnpm run lint

      - run: pnpm test

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check:esm is the reason this is a matrix.  Node classifies lib/esm from its own
        # package.json marker on every version, but only 22.12 and later fall back to sniffing
        # module syntax, so a regression in that marker fails differently either side of it.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version here: action-setup reads package.json's packageManager, which pins pnpm
      # by sha512.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --ignore-scripts keeps the root `prepare` script from building during install, so a
      # broken build reports as a failed build step rather than a failed install.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm audit --prod

      - run: pnpm run build

      - run: pnpm run check:esm

      - run: pnpm run lint

      - run: pnpm run spell

      - run: pnpm test

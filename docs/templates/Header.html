{{ define "Header" }}
<header class="site-header">
    <div class="header-container">
        {{ $Site := .Site }}
        <div class="logo">
            <a href="{{.Site.PathPrefix}}/">
                <img src="{{.Site.PathPrefix}}/static/images/logo.png" alt="Notations" class="logo-img" onerror="this.style.display='none'">
                <!--<span class="logo-text">{{ (json "SiteMetadata.json" "siteName") }}</span>-->
            </a>
        </div>

        <button type="button" class="nav-toggle" id="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <nav class="main-nav" id="main-nav" aria-label="Main">
            {{ $navLinks := (json "HeaderNavLinks.json" "") }}
            {{ range $navLinks }}
            <div class="nav-item{{ if .children }} has-children{{ end }}">
                <a href="{{$Site.PathPrefix}}/{{ .url }}" class="nav-link">
                    {{ if .icon }}<i class="icon-{{ .icon }}"></i>{{ end }}
                    {{ .name }}
                </a>
                {{ if .children }}
                <div class="nav-dropdown">
                    {{ range .children }}
                    <a href="{{$Site.PathPrefix}}/{{ .url }}" class="dropdown-item">{{ .name }}</a>
                    {{ end }}
                </div>
                {{ end }}
            </div>
            {{ end }}
        </nav>

        <div class="header-actions">
            <button type="button" class="search-trigger" id="search-trigger" aria-label="Search the docs" title="Search (/ or Ctrl+K)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke-width="2" />
                    <path stroke-linecap="round" stroke-width="2" d="M20 20l-3.5-3.5" />
                </svg>
                <span class="search-trigger-label">Search</span>
                <kbd>/</kbd>
            </button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <!-- Sun icon (shown in dark mode) -->
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
            <a href="{{ (json "SiteMetadata.json" "repository") }}" class="btn-github" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub repository">
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
    </div>
</header>
{{ end }}
